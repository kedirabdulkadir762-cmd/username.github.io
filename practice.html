<!DOCTYPE html>
<html>
<head>
<title>Math Practice</title>

<style>

body{
font-family: Arial;
text-align:center;
background:#0b2c33;
color:white;
padding:20px;
}

.quiz-box{
background:white;
color:black;
padding:20px;
border-radius:10px;
max-width:300px;
margin:auto;
}

button{
margin-top:10px;
padding:10px 20px;
border:none;
border-radius:5px;
background:#3b82f6;
color:white;
font-size:16px;
}

</style>

</head>

<body>

<h1>Math Practice</h1>

<div class="quiz-box">

<p>25 + 15 = ?</p>

<input type="number" id="answer">

<br>

<button onclick="checkAnswer()">Check Answer</button>

<p id="result"></p>

</div>

<script>

function checkAnswer(){

var user = document.getElementById("answer").value;

if(user == 40){

document.getElementById("result").innerHTML = "Correct! 🎉";

}

else{

document.getElementById("result").innerHTML = "Try again ❌";

}

}

</script>

</body>
</html>
